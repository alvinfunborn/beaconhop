<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>BeaconHop Tabs</title>
<link rel="stylesheet" href="popup.css">
<body><header><img src="icons/48.png" width="32" height="32" alt=""><h1>BeaconHop Tabs</h1></header>
<p>网页缩略图 · Tab previews</p>
<p>开启后，在访问网页时缓存小图，Ctrl+Tab 直接读取。图片只留在本机内存；不采集无痕页面。</p>
<p>Cache small previews as you visit pages. Images stay in local memory; private tabs are excluded.</p>

<p id="status" role="status"></p>
<button id="enable">开启缩略图 / Enable previews</button>
<button id="disable" hidden>关闭并清除 / Disable &amp; clear</button>
<button id="reconnect">重新连接 BH / Reconnect</button>
