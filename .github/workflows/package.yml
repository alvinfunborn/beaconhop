name: Package BeaconHop
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed packages as a release (leave disabled to build only)'
        type: boolean
        default: false
      tag:
        description: 'Stable version tag, matching package.json'
        type: string
        default: 'v0.3.1'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
            artifact: macos-arm64
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:version
      - run: npm run plugins:bundle
      - name: Require official Edge listing before publishing
        if: inputs.publish
        run: npm run plugins:check-release
      - run: npm test
      - name: Configure update channel
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
        run: node scripts/configure-update-channel.mjs
      - name: Build signed updater packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Updater signing key is required'; exit 1; }
          npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json --config logs/updater-channel.json
      - uses: actions/upload-artifact@v4
        with:
          name: Application-plugins-${{ matrix.artifact }}
          path: src-tauri/resources/plugins
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BeaconHop-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  manifest:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: BeaconHop-*
          path: packages
      - name: Collect signed platform packages
        run: |
          mkdir signed
          cp packages/BeaconHop-macos-arm64/macos/BeaconHop.app.tar.gz signed/beaconhop-macos-arm64.app.tar.gz
          cp packages/BeaconHop-macos-arm64/macos/BeaconHop.app.tar.gz.sig signed/beaconhop-macos-arm64.app.tar.gz.sig
          cp packages/BeaconHop-windows-x64/nsis/*-setup.exe signed/beaconhop-windows-setup.exe
          cp packages/BeaconHop-windows-x64/nsis/*-setup.exe.sig signed/beaconhop-windows-setup.exe.sig
      - name: Generate complete manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
        run: |
          node scripts/check-version.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs"; if(process.env.RELEASE_TAG !== "v"+JSON.parse(readFileSync("package.json")).version) throw new Error("Release tag must match package.json");'
          node --test scripts/create-update-manifest.test.mjs
          node scripts/create-update-manifest.mjs signed "$RELEASE_TAG" "$RELEASE_REPOSITORY"
          cd signed && sha256sum beaconhop-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BeaconHop-signed-updates
          path: signed
          if-no-files-found: error
      - name: Publish only when explicitly requested
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
        run: gh release create "$RELEASE_TAG" signed/* --repo "$RELEASE_REPOSITORY" --title "BeaconHop $RELEASE_TAG" --notes "Signed macOS and Windows packages. See the source repository for changes."
