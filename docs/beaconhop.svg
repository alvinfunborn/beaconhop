<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>BeaconHop</title>
  <desc>Three violet windows rise out of a soft motion trail. A bright hint key marks the front window.</desc>
  <defs>
    <linearGradient id="background" x1="124" y1="24" x2="852" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#301266"/><stop offset=".48" stop-color="#18093F"/><stop offset="1" stop-color="#10052F"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientTransform="translate(612 242) rotate(111) scale(646 616)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9E6AFF" stop-opacity=".27"/><stop offset="1" stop-color="#6D34DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rear" x1="0" y1="0" x2="570" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F56E5"/><stop offset="1" stop-color="#3E188F"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="560" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2A3F9"/><stop offset=".46" stop-color="#9765E4"/><stop offset="1" stop-color="#622FC0"/>
    </linearGradient>
    <linearGradient id="front" x1="58" y1="0" x2="474" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".47" stop-color="#E5D8FF"/><stop offset="1" stop-color="#AA84E8"/>
    </linearGradient>
    <linearGradient id="glass" x1="20" y1="74" x2="530" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40216E"/><stop offset="1" stop-color="#241049"/>
    </linearGradient>
    <linearGradient id="hint" x1="218" y1="140" x2="342" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2CD"/><stop offset=".5" stop-color="#FFDB8F"/><stop offset="1" stop-color="#F2B653"/>
    </linearGradient>
    <filter id="trail" x="-40%" y="-40%" width="180%" height="210%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18 7"/></filter>
    <filter id="shadow" x="-25%" y="-25%" width="155%" height="175%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="24" stdDeviation="23" flood-color="#080019" flood-opacity=".54"/></filter>
    <filter id="keyGlow" x="-80%" y="-80%" width="260%" height="270%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="18" flood-color="#FBCF86" flood-opacity=".24"/>
      <feDropShadow dx="0" dy="7" stdDeviation="3" flood-color="#0E0424" flood-opacity=".45"/>
    </filter>
    <clipPath id="mask"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#mask)">
    <rect width="1024" height="1024" fill="url(#background)"/>
    <rect width="1024" height="1024" fill="url(#bloom)"/>
    <g transform="translate(156 206) rotate(-11 350 315)">
      <!-- The trailing copies get softer as they fall behind the selected window. -->
      <g transform="translate(-30 332)" opacity=".36" filter="url(#trail)"><rect width="568" height="354" rx="42" fill="#753AD3"/></g>
      <g transform="translate(0 278)" opacity=".72">
        <rect width="568" height="354" rx="42" fill="url(#rear)" stroke="#B68AF0" stroke-opacity=".32" stroke-width="3"/>
        <path d="M3 70H565" stroke="#DBBEFF" stroke-opacity=".25" stroke-width="3"/>
        <g fill="#D9BFFF" opacity=".48"><circle cx="36" cy="36" r="7"/><circle cx="61" cy="36" r="7"/><circle cx="86" cy="36" r="7"/></g>
      </g>
      <g transform="translate(57 139)" filter="url(#shadow)">
        <rect width="568" height="354" rx="42" fill="url(#middle)" stroke="#DDC4FF" stroke-opacity=".52" stroke-width="3"/>
        <path d="M3 70H565" stroke="#F0DDFF" stroke-opacity=".36" stroke-width="3"/>
        <g fill="#F3E6FF" opacity=".6"><circle cx="36" cy="36" r="7"/><circle cx="61" cy="36" r="7"/><circle cx="86" cy="36" r="7"/></g>
      </g>
      <g transform="translate(114 0)" filter="url(#shadow)">
        <rect width="568" height="354" rx="42" fill="url(#front)"/>
        <rect x="1.5" y="1.5" width="565" height="351" rx="40.5" stroke="white" stroke-opacity=".65" stroke-width="3"/>
        <g fill="#7D5B9F"><circle cx="36" cy="36" r="7"/><circle cx="61" cy="36" r="7"/><circle cx="86" cy="36" r="7"/></g>
        <rect x="230" y="30" width="108" height="9" rx="4.5" fill="#795B9F" fill-opacity=".24"/>
        <rect x="18" y="72" width="532" height="264" rx="27" fill="url(#glass)"/>
        <rect x="19" y="73" width="530" height="262" rx="26" stroke="white" stroke-opacity=".12" stroke-width="2"/>
        <g transform="translate(0 2)" filter="url(#keyGlow)">
          <rect x="224" y="144" width="120" height="120" rx="27" fill="#C98C3E"/>
          <rect x="224" y="138" width="120" height="120" rx="27" fill="url(#hint)"/>
          <rect x="226" y="140" width="116" height="116" rx="25" stroke="#FFF6DF" stroke-opacity=".75" stroke-width="3"/>
          <!-- H is a path so the hint is identical on every platform. -->
          <path d="M262 171V225M306 171V225M262 198H306" stroke="#553075" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
