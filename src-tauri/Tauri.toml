identifier = "com.beaconhop.app"
version = "0.1.0"
productName = "BeaconHop"

[build]
beforeDevCommand = "npm run dev"
beforeBuildCommand = "npm run build"
devUrl = "http://localhost:1437"
frontendDist = "../dist"

[app]
macOSPrivateApi = true

[app.security]
capabilities = ["main-capability"]
csp = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src ipc: http://ipc.localhost; script-src 'self'"

[[app.windows]]
label = "main"
title = "BeaconHop"
url = "index.html"
width = 1020
height = 760
minWidth = 760
minHeight = 580
center = true
visible = false

[[app.windows]]
label = "switcher"
title = "BeaconHop Switcher"
url = "index.html?view=switcher"
width = 1000
height = 640
visible = false
decorations = false
transparent = true
shadow = true
skipTaskbar = true
alwaysOnTop = true
resizable = false
focus = false

[bundle]
active = true
targets = "all"
icon = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]
copyright = "Copyright © 2026 BeaconHop contributors. Based on Screen Buoy (MIT)."
category = "Productivity"
shortDescription = "Follow the hint. Hop to your work."
longDescription = "Keyboard-first window navigation with visual hints, previews and search across desktops and displays."

[bundle.macOS]
minimumSystemVersion = "14.0"
signingIdentity = "-"

[bundle.windows.nsis]
displayLanguageSelector = true
languages = ["English", "SimpChinese"]
