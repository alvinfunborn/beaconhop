<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="100 125 800 800" fill="none">
  <title>BeaconHop monochrome window stack</title>
  <!-- Same rotation, window proportions, positions and hint as beaconhop.svg.
       The masks keep transparent panes from exposing the windows behind them. -->
  <defs>
    <mask id="rear" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="1100">
      <rect x="-100" y="-100" width="1000" height="1100" fill="white"/>
      <rect x="57" y="139" width="568" height="354" rx="42" fill="black"/>
    </mask>
    <mask id="middle" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="1100">
      <rect x="-100" y="-100" width="1000" height="1100" fill="white"/>
      <rect x="114" width="568" height="354" rx="42" fill="black"/>
    </mask>
    <mask id="front" maskUnits="userSpaceOnUse" x="100" y="-10" width="600" height="380">
      <rect x="114" width="568" height="354" rx="42" fill="white"/>
      <rect x="132" y="72" width="532" height="264" rx="27" fill="black"/>
      <g fill="black"><circle cx="150" cy="36" r="7"/><circle cx="175" cy="36" r="7"/><circle cx="200" cy="36" r="7"/></g>
      <rect x="338" y="140" width="120" height="120" rx="27" fill="white"/>
      <path d="M376 173V227M420 173V227M376 200H420" stroke="black" stroke-width="12" stroke-linecap="round"/>
    </mask>
  </defs>
  <g transform="translate(156 206) rotate(-11 350 315)" fill="black">
    <rect y="278" width="568" height="354" rx="42" opacity=".45" mask="url(#rear)"/>
    <rect x="57" y="139" width="568" height="354" rx="42" opacity=".7" mask="url(#middle)"/>
    <rect x="114" width="568" height="354" rx="42" mask="url(#front)"/>
  </g>
</svg>
