[package]
name = "beaconhop"
version = "0.1.0"
description = "Follow the hint. Hop to your work."
authors = ["BeaconHop contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = ["config-toml"] }

[dependencies]
serde_json = "1.0"
sys-locale = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.5.0", features = ["tray-icon", "devtools", "image-ico", "image-png", "config-toml", "macos-private-api"] }
once_cell = "1.21.3"
log = "0.4"
flexi_logger = "0.30.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
png = "0.17"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common"
] }
windows58 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }
winvd = "=0.0.49"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
